name: Windows Release

on:
  push:
    branches: [main]
    paths: [windows-release-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true
      - name: Prepare dependencies and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_windows_fvp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows_release_metadata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows release
        shell: pwsh
        run: |
          $meta = Get-Content build_metadata.json | ConvertFrom-Json
          flutter build windows --release --no-pub --build-name=2.9.9 --build-number=$($meta.BUILD_NUMBER) --dart-define-from-file=build_metadata.json --dart-define=isTV=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows/system32/* build/windows/x64/runner/Release/ -Force
          python scripts/package_windows_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: packages/*
      - name: Publish Windows-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $meta = Get-Content versions.json | ConvertFrom-Json
          gh release create $meta.release_tag --draft --target $env:GITHUB_SHA --title "极简TV 2.9.9 · $($meta.build_date)（Windows）" --notes-file docs/windows-release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $meta.release_tag (Get-ChildItem packages/* | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $meta.release_tag --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
